<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Bóveda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Control Bóveda de Casino</h1>
    <div class="saldo-actual">
      <small>Saldo actual de bóveda</small>
      <b id="saldoActual">S/ 0.00</b>
    </div>
    <label class="inicial">Saldo inicial de bóveda (antes del primer registro)
      <input type="number" step="0.01" id="saldoInicial" inputmode="decimal" placeholder="0.00">
    </label>
  </header>

  <section class="calendario">
    <h2>Seleccionar fecha</h2>
    <p class="ayuda">Toca uno o más días para ingresar sus datos.</p>
    <div class="mes">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <span id="mesTitulo"></span>
      <button id="next" aria-label="Mes siguiente">›</button>
    </div>
    <div class="semana">
      <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
    </div>
    <div class="grilla" id="grilla"></div>
    <div class="leyenda">
      <span><i class="pt sel"></i> seleccionado</span>
      <span><i class="pt dato"></i> con datos</span>
      <button id="limpiar" type="button">Quitar selección</button>
    </div>
  </section>

  <main id="formularios"></main>

  <section>
    <h2>Resumen del mes</h2>
    <div class="resumen" id="resumenMes"></div>
  </section>

  <footer class="pie">
    <button id="exportar">Exportar mes (CSV)</button>
    <p>Los datos se guardan en este dispositivo.</p>
  </footer>

  <template id="tplDia">
    <article class="dia">
      <header class="dia-cab">
        <h3 class="fecha"></h3>
        <button type="button" class="cerrar" aria-label="Quitar de la selección">✕</button>
      </header>
      <form class="formDia">
        <div class="bloque">
          <span class="num">1</span>
          <label>Izipay — venta del día (S/)
            <input type="number" step="0.01" min="0" name="izipay" inputmode="decimal" placeholder="0.00">
          </label>
        </div>

        <div class="bloque">
          <span class="num">2</span>
          <div class="grupo">
            <span class="lbl">Ganancia o pérdida en caja</span>
            <div class="seg">
              <label><input type="radio" value="ganancia"> Ganancia</label>
              <label><input type="radio" value="perdida"> Pérdida</label>
            </div>
            <input type="number" step="0.01" min="0" name="monto" inputmode="decimal" placeholder="0.00">
            <small class="nota-gp"></small>
          </div>
        </div>

        <div class="bloque">
          <span class="num">3</span>
          <div class="grupo">
            <span class="lbl">Reposición a caja</span>
            <output class="reposicion">S/ 0.00</output>
            <small>Se saca de bóveda para cubrir la pérdida de caja.</small>
          </div>
        </div>

        <div class="bloque">
          <span class="num">4</span>
          <label>Incremento externo (S/)
            <input type="number" step="0.01" min="0" name="incremento" inputmode="decimal">
            <small class="nota-inc"></small>
          </label>
        </div>

        <div class="bloque">
          <span class="num">5</span>
          <div class="grupo">
            <span class="lbl">Gastos o retiros de bóveda</span>
            <ul class="movs"></ul>
            <button type="button" class="agregar">+ Agregar gasto / retiro</button>
          </div>
        </div>

        <div class="totales"></div>
        <div class="acciones">
          <button type="button" class="borrar">Borrar datos del día</button>
        </div>
      </form>
    </article>
  </template>

  <template id="tplMov">
    <li class="mov">
      <select name="tipo">
        <option value="gasto">Gasto</option>
        <option value="retiro">Retiro</option>
      </select>
      <input type="text" name="concepto" placeholder="Concepto">
      <input type="number" step="0.01" min="0" name="montoMov" inputmode="decimal" placeholder="0.00">
      <button type="button" class="quitar" aria-label="Quitar">✕</button>
    </li>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
